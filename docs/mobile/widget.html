<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Мої ігри · віджет</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* Сторінка для програм-віджетів (Android: WebsiteWidget, AnyWidget). Без прокрутки, заповнює будь-який розмір.
     Програма-посередник кладе зверху власну смугу (дата, «Available in …») — під неї лишаємо порожній відступ --top,
     який задає параметр #…&top=0..60 (типово 30 px). */
  :root { --bg:#0b0c0f; --panel:#111317; --border:#212429; --text:#ececf0; --muted:#858a96; --text2:#a9adb8;
          --ok:#4cc38a; --ok-text:#6fdca0; --bad:#f2555a; --bad-text:#ff8a8a; --accent:#cc4630; color-scheme:dark;
          --top:30px; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--panel); color:var(--text); overflow:hidden; }
  body { font:clamp(12px, min(4.2vw, 5.5vh), 18px)/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a.w { display:flex; flex-direction:column; gap:.5em; height:100%; color:inherit; text-decoration:none;
        padding:calc(var(--top) + .45em) .75em .5em; }

  .head { display:flex; align-items:center; gap:.6em; min-width:0; }
  .head > b { font-size:2.4em; font-weight:800; line-height:1; letter-spacing:-.02em; flex:none; }
  .head .meta { display:flex; flex-direction:column; min-width:0; gap:.1em; }
  .head .meta > * { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .medal { font-weight:700; color:var(--text); }
  .medal .st { color:#e7b84a; letter-spacing:-.05em; }
  .rec { color:var(--muted); font-size:.85em; }
  .good { color:var(--ok-text); } .badc { color:var(--bad-text); }

  .form { display:flex; gap:.22em; flex:none; }
  .form i { flex:1; height:.6em; border-radius:.15em; background:#2b2e34; }
  .form i.w { background:var(--ok); } .form i.l { background:var(--bad); }

  /* Останні ігри: стільки рядків, скільки вміщається (решту ховає fit()); залишок висоти — рівно між рядками. */
  .games { flex:1; min-height:0; overflow:hidden; display:flex; flex-direction:column; justify-content:space-between; }
  .g { display:flex; align-items:center; gap:.55em; min-width:0; padding-left:.45em; border-left:.18em solid var(--bad); }
  .g.win { border-left-color:var(--ok); }
  .g img { width:3.2em; height:1.8em; border-radius:.25em; object-fit:cover; background:#1d2026; flex:none; }
  .g .t { min-width:0; flex:1; }
  .g .h, .g .s { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g .h { font-weight:650; }
  .g .s { color:var(--muted); font-size:.82em; }
  .g .s b { color:var(--text2); font-weight:600; }
  .g[hidden] { display:none; }

  .foot { color:var(--muted); font-size:.72em; display:flex; gap:.6em; justify-content:space-between; flex:none; min-width:0; }
  .foot .nick { color:var(--text2); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
  .foot .upd { white-space:nowrap; flex:none; }

  .msg { margin:auto; text-align:center; color:var(--text2); padding:0 .4em; }
  .msg b { display:block; color:var(--text); margin-bottom:.3em; }

  /* Маленька висота (2×1, 4×1): лише вінрейт і форма. */
  @media (max-height: 150px) { .games, .foot { display:none; } .head > b { font-size:2.1em; } }
  @media (max-height: 100px) { .form { display:none; } }
  /* Велика висота: трохи більші рядки ігор. */
  @media (min-height: 260px) { .g img { width:3.6em; height:2em; } .head > b { font-size:2.7em; } }
</style>
</head>
<body>
<a class="w" id="w" href="./" target="_top"><div class="msg">Завантаження…</div></a>
<script>
'use strict';
// Параметри — лише з фрагмента (#id=…&top=…): програми-віджети мають власне сховище, тож посилання самодостатнє,
// а фрагмент не йде на сервер.
const API = 'https://api.opendota.com/api', CDN = 'https://cdn.cloudflare.steamstatic.com';
const RANKS = ['', 'Herald', 'Guardian', 'Crusader', 'Archon', 'Legend', 'Ancient', 'Divine', 'Immortal'];
const box = document.getElementById('w');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* немає сховища */ } } };
const hashParam = (name) => (location.hash.match(new RegExp(`[#&]${name}=([^&]*)`)) || [])[1];

function accountId() {
  const m = (hashParam('id') || '').match(/^\d{1,20}$/);
  if (!m) return null;
  let n = BigInt(m[0]);
  if (n >= 76561197960265728n) n -= 76561197960265728n;
  return n > 0n && n <= 4294967295n ? Number(n) : null;
}
function applyTop() {
  const v = hashParam('top');
  const n = v != null && /^\d{1,3}$/.test(v) ? Math.min(60, Number(v)) : 30;
  document.documentElement.style.setProperty('--top', `${n}px`);
}
const won = (m) => (m.player_slot < 128) === m.radiant_win;
function ago(unix) {
  const s = Date.now() / 1000 - unix;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))} хв тому`;
  if (s < 86400) return `${Math.round(s / 3600)} год тому`;
  const d = Math.round(s / 86400);
  return d === 1 ? 'вчора' : `${d} дн. тому`;
}
async function get(path) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(API + path, { signal: ctrl.signal });
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } finally { clearTimeout(t); }
}
async function heroes() {
  const c = ls.get('da_widget_heroes');
  if (c && Date.now() - c.ts < 7 * 86400000) return c.h;
  const all = await get('/constants/heroes');
  const h = {};
  for (const v of Object.values(all)) h[v.id] = [v.localized_name, v.img];
  ls.set('da_widget_heroes', { ts: Date.now(), h });
  return h;
}

function gameRow(m, heroes) {
  const h = heroes[m.hero_id] || ['', ''], w = won(m);
  return `<div class="g${w ? ' win' : ''}">${h[1] ? `<img src="${esc(CDN + h[1])}" alt="">` : '<img alt="">'}
    <div class="t"><div class="h ${w ? 'good' : 'badc'}">${w ? 'Перемога' : 'Поразка'}${h[0] ? ` · ${esc(h[0])}` : ''}</div>
    <div class="s"><b>${m.kills}/${m.deaths}/${m.assists}</b> · ${esc(ago(m.start_time))}</div></div></div>`;
}

// Показує стільки ігор, скільки вміщається повністю; решту ховає (без обрізаних рядків).
function fit() {
  const list = box.querySelector('.games');
  if (!list) return;
  const rows = [...list.children];
  rows.forEach((r) => { r.hidden = false; });
  list.style.justifyContent = 'flex-start';
  const limit = list.getBoundingClientRect().bottom + 0.5;
  for (const r of rows) r.hidden = r.getBoundingClientRect().bottom > limit;
  list.style.justifyContent = '';
}

function draw(d, stale) {
  const rt = d.rank_tier, tier = Math.floor((rt || 0) / 10), stars = (rt || 0) % 10;
  const medal = !rt ? '' : tier === 8 ? 'Immortal'
    : `${esc(RANKS[tier] || '')} <span class="st">${'★'.repeat(Math.min(stars, 5))}</span>`;
  const total = d.wl.win + d.wl.lose, p = total ? Math.round(d.wl.win / total * 100) : 0;
  const cls = p >= 52 ? 'good' : p <= 47 ? 'badc' : '';
  const form = d.matches.slice(0, 10).map((m) => `<i class="${won(m) ? 'w' : 'l'}"></i>`).join('');
  const t = new Date(d.ts).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
  box.href = `./#id=${d.id}`;
  box.innerHTML = `
    <div class="head"><b class="${cls}">${total ? p + '%' : '—'}</b>
      <div class="meta">${medal ? `<span class="medal">${medal}</span>` : ''}
        <span class="rec">${total ? `${d.wl.win}В · ${d.wl.lose}П за ${total}` : 'немає ігор'}</span></div></div>
    ${form ? `<div class="form">${form}</div>` : ''}
    <div class="games">${d.matches.slice(0, 10).map((m) => gameRow(m, d.heroes)).join('')}</div>
    <div class="foot"><span class="nick">${esc(d.name)}</span><span class="upd">${stale ? 'збережене · ' : ''}${t}</span></div>`;
  fit();
}

function message(title, text) {
  box.innerHTML = `<div class="msg"><b>${esc(title)}</b>${esc(text)}</div>`;
}

async function main() {
  const id = accountId();
  if (!id) return message('Немає Dota ID', 'Додайте до посилання #id=ваш_ID');
  const key = `da_widget_${id}`;
  try {
    const [player, wl, matches, hs] = await Promise.all([
      get(`/players/${id}`), get(`/players/${id}/wl?limit=20`), get(`/players/${id}/matches?limit=10`), heroes()]);
    if (!player.profile) return message('Гравця не знайдено', `OpenDota не знає ID ${id}`);
    const d = { id, ts: Date.now(), name: player.profile.personaname || `Гравець ${id}`, rank_tier: player.rank_tier,
                wl, matches, heroes: hs };
    ls.set(key, { ...d, heroes: undefined });
    draw(d, false);
  } catch {
    const c = ls.get(key), hs = ls.get('da_widget_heroes');
    if (c) return draw({ ...c, heroes: (hs && hs.h) || {} }, true);
    message('OpenDota не відповідає', 'Спробуйте оновити віджет пізніше');
  }
}
applyTop();
addEventListener('resize', fit);
addEventListener('hashchange', () => { applyTop(); fit(); });
main();
</script>
</body>
</html>
