<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Мої ігри · віджет</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  /* Компактна сторінка для програм-віджетів (Android): вміщається в будь-який розмір, без прокрутки. */
  :root { --bg:#0b0c0f; --panel:#111317; --border:#212429; --text:#ececf0; --muted:#858a96; --text2:#a9adb8;
          --ok:#4cc38a; --ok-text:#6fdca0; --bad:#f2555a; --bad-text:#ff8a8a; --accent:#cc4630; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--bg); color:var(--text); overflow:hidden; }
  body { font:clamp(11px, 3.6vw, 16px)/1.3 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  a.w { display:flex; flex-direction:column; gap:.45em; height:100%; padding:.8em .9em; color:inherit; text-decoration:none;
        background:var(--panel); border:1px solid var(--border); border-radius:1em; }
  .top { display:flex; align-items:center; gap:.5em; min-width:0; }
  .nick { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0; }
  .medal { font-size:.78em; font-weight:650; color:var(--text2); white-space:nowrap; }
  .wr { display:flex; align-items:baseline; gap:.45em; }
  .wr b { font-size:2.2em; font-weight:800; line-height:1; }
  .wr span { color:var(--muted); font-size:.85em; }
  .good { color:var(--ok-text); } .badc { color:var(--bad-text); }
  .form { display:flex; gap:.25em; }
  .form i { flex:1; height:.75em; border-radius:.2em; background:#2b2e34; }
  .form i.w { background:var(--ok); } .form i.l { background:var(--bad); }
  .last { display:flex; align-items:center; gap:.55em; min-width:0; margin-top:auto; }
  .last img { width:3.6em; height:2em; border-radius:.3em; object-fit:cover; background:#1d2026; flex:none; }
  .last div { min-width:0; }
  .last .h { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .last .s { color:var(--muted); font-size:.82em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .foot { color:var(--muted); font-size:.7em; display:flex; justify-content:space-between; }
  .msg { margin:auto; text-align:center; color:var(--text2); }
  .msg b { display:block; color:var(--text); margin-bottom:.3em; }
  @media (max-height: 150px) { .last, .foot { display:none; } }
  @media (max-height: 95px) { .form { display:none; } }
</style>
</head>
<body>
<a class="w" id="w" href="./" target="_top"><div class="msg">Завантаження…</div></a>
<script>
'use strict';
// ID — лише з фрагмента (#id=…): програми-віджети мають власне сховище, тож посилання самодостатнє.
const API = 'https://api.opendota.com/api', CDN = 'https://cdn.cloudflare.steamstatic.com';
const RANKS = ['', 'Herald', 'Guardian', 'Crusader', 'Archon', 'Legend', 'Ancient', 'Divine', 'Immortal'];
const box = document.getElementById('w');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const ls = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
             set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* немає сховища */ } } };

function accountId() {
  const m = location.hash.match(/id=(\d{1,20})/);
  if (!m) return null;
  let n = BigInt(m[1]);
  if (n >= 76561197960265728n) n -= 76561197960265728n;
  return n > 0n && n <= 4294967295n ? Number(n) : null;
}
const won = (m) => (m.player_slot < 128) === m.radiant_win;
function ago(unix) {
  const s = Date.now() / 1000 - unix;
  if (s < 3600) return `${Math.max(1, Math.round(s / 60))} хв тому`;
  if (s < 86400) return `${Math.round(s / 3600)} год тому`;
  const d = Math.round(s / 86400);
  return d === 1 ? 'вчора' : `${d} дн. тому`;
}
async function get(path) {
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(API + path, { signal: ctrl.signal });
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } finally { clearTimeout(t); }
}
async function heroes() {
  const c = ls.get('da_widget_heroes');
  if (c && Date.now() - c.ts < 7 * 86400000) return c.h;
  const all = await get('/constants/heroes');
  const h = {};
  for (const v of Object.values(all)) h[v.id] = [v.localized_name, v.img];
  ls.set('da_widget_heroes', { ts: Date.now(), h });
  return h;
}

function draw(d, stale) {
  const rt = d.rank_tier, tier = Math.floor((rt || 0) / 10), stars = (rt || 0) % 10;
  const medal = !rt ? '' : tier === 8 ? 'Immortal' : `${RANKS[tier] || ''} ${'★'.repeat(Math.min(stars, 5))}`;
  const total = d.wl.win + d.wl.lose, p = total ? Math.round(d.wl.win / total * 100) : 0;
  const cls = p >= 52 ? 'good' : p <= 47 ? 'badc' : '';
  const form = d.matches.slice(0, 10).map((m) => `<i class="${won(m) ? 'w' : 'l'}"></i>`).join('');
  const last = d.matches[0];
  const h = last && d.heroes[last.hero_id] || ['', ''];
  const t = new Date(d.ts);
  box.href = `./#id=${d.id}`;
  box.innerHTML = `
    <div class="top"><span class="nick">${esc(d.name)}</span><span class="medal">${esc(medal)}</span></div>
    <div class="wr"><b class="${cls}">${total ? p + '%' : '—'}</b><span>${total ? `${d.wl.win}В · ${d.wl.lose}П за ${total}` : 'немає ігор'}</span></div>
    <div class="form">${form}</div>
    ${last ? `<div class="last">${h[1] ? `<img src="${esc(CDN + h[1])}" alt="">` : ''}
      <div><div class="h ${won(last) ? 'good' : 'badc'}">${won(last) ? 'Перемога' : 'Поразка'} · ${esc(h[0])}</div>
      <div class="s">${last.kills}/${last.deaths}/${last.assists} · ${esc(ago(last.start_time))}</div></div></div>` : ''}
    <div class="foot"><span>${stale ? 'збережене · ' : ''}${t.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' })}</span><span>OpenDota</span></div>`;
}

function message(title, text) {
  box.innerHTML = `<div class="msg"><b>${esc(title)}</b>${esc(text)}</div>`;
}

async function main() {
  const id = accountId();
  if (!id) return message('Немає Dota ID', 'Додайте до посилання #id=ваш_ID');
  const key = `da_widget_${id}`;
  try {
    const [player, wl, matches, hs] = await Promise.all([
      get(`/players/${id}`), get(`/players/${id}/wl?limit=20`), get(`/players/${id}/matches?limit=10`), heroes()]);
    if (!player.profile) return message('Гравця не знайдено', `OpenDota не знає ID ${id}`);
    const d = { id, ts: Date.now(), name: player.profile.personaname || `Гравець ${id}`, rank_tier: player.rank_tier,
                wl, matches, heroes: hs };
    ls.set(key, { ...d, heroes: undefined });
    draw(d, false);
  } catch {
    const c = ls.get(key), hs = ls.get('da_widget_heroes');
    if (c) return draw({ ...c, heroes: (hs && hs.h) || {} }, true);
    message('OpenDota не відповідає', 'Спробуйте оновити віджет пізніше');
  }
}
main();
</script>
</body>
</html>
